services:
  jolt-transform-web:
    image: halversondm/jolt-transform-web:latest
    networks:
      - app-tier
    volumes:
      - ~/.aws:/root/.aws:ro
    ports:
      - "9200:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
networks:
  app-tier:
    driver: bridge
volumes:
  postgres_data: {}